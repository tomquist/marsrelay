name: CI

on:
  push:
  pull_request:

jobs:
  # Read the ESPHome pin from ESPHOME_VERSION, the one place it is set, which
  # the dev setup in AGENTS.md installs too.
  version:
    runs-on: ubuntu-latest
    outputs:
      esphome_version: ${{ steps.pin.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: echo "version=$(cat ESPHOME_VERSION)" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci-dispatch.yml
    with:
      esphome_version: ${{ needs.version.outputs.esphome_version }}
      run_tests: true
