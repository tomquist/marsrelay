substitutions:
  device_name: marsrelay-esp32s3
  friendly_name: Marsrelay ESP32S3
  wifi_ssid: "YOUR_WIFI_SSID"
  wifi_password: "YOUR_WIFI_PASSWORD"
  ap_ssid: "Marsrelay Fallback"
  ap_password: "YOUR_AP_PASSWORD"
  mqtt_broker: 192.168.1.10
  mqtt_username: "mqtt_user"
  mqtt_password: "mqtt_password"
  mqtt_topic_prefix: "marsrelay"
  # Timezone used to sync the battery clock (see https://en.wikipedia.org/wiki/List_of_tz_database_time_zones).
  timezone: "Europe/Berlin"
  # UDP proxy port for power meter discovery (see https://github.com/tomquist/AstraMeter)
  # - Port 1010: Shelly Pro 3EM for B2500 firmware up to v224, Jupiter, Venus
  # - Port 2220: Shelly Pro 3EM for B2500 firmware v226+
  # - Port 2222: Shelly 3EM gen3
  # - Port 2223: Shelly Pro EM50
  # - Port 12345: CT001/CT002/CT003
  udp_proxy_port: "1010"
  psram:
    # Set to true if your ESP32S3 has PSRAM.
    enabled: true
    # This needs to be set correctly! See https://esphome.io/components/psram/ for more information.
    mode: quad

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

psram:
  mode: ${psram.mode}
  disabled: ${false if psram.enabled else true}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_LWIP_IPV6: y
      CONFIG_ESP_TLS_INSECURE: y  # Allow skipping certificate verification
      CONFIG_ESP_TLS_SKIP_SERVER_CERT_VERIFY: y  # Skip server certificate verification
      CONFIG_LWIP_MAX_SOCKETS: "58"  # Reduced from 64 to ensure LWIP_SOCKET_OFFSET >= 6 (FD_SETSIZE=64, so offset = 64-58=6)
      CONFIG_LWIP_TCP_MSL: "30"  # Reduce TIME_WAIT timeout from default 60s to 30s (in seconds)
      CONFIG_LWIP_SOCKET_OFFSET: "6"  # Required for esp_vfs_console compatibility (must be >= 6 for esp_vfs_console)

external_components:
  - source:
      type: local
      path: ./components

logger:

# Keeps the ESP32 system clock in sync so the marstack component serves the
# correct date/time to the battery (GET /app/neng/getDateInfoeu.php).
time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  ap:
    ssid: ${ap_ssid}
    password: ${ap_password}
  use_psram: ${psram.enabled}

capture_dns:
  id: capture_dns_server

# UDP proxy bridges broadcasts between AP and STA networks for power meter discovery
# Add multiple entries if you need to support different firmware versions
udp_proxy:
  - id: meter_proxy
    port: ${udp_proxy_port}

mqtt:
  id: mqtt_client
  broker: ${mqtt_broker}
  username: ${mqtt_username}
  password: ${mqtt_password}
  on_connect:
    - lambda: |-
        // Batteries use the marstek_energy prefix on newer firmware and the
        // hame_energy prefix on older firmware; forward commands for both.
        for (const char *pattern : {"marstek_energy/+/App/+/ctrl", "hame_energy/+/App/+/ctrl"}) {
          id(mqtt_client).subscribe(pattern, [=](const std::string &topic, const std::string &payload) {
            ESP_LOGD("MQTT", "Received control message: %s", topic.c_str());
            if (topic.find("/App/") == std::string::npos) {
              ESP_LOGD("MQTT", "Not a control message, skipping");
              return;
            }
            if (topic.find("/ctrl") == std::string::npos) {
              ESP_LOGD("MQTT", "Not a control message, skipping");
              return;
            }
            id(local_broker).publish_message(topic, payload);
          });
        }

mosquitto_broker:
  id: local_broker
  tls: true
  tls_skip_verification: true
  port: 8883
  max_clients: 5
  on_message:
    # Only forward messages containing /device/
    - if:
        condition:
          lambda: 'return topic.find("/device/") != std::string::npos;'
        then:
          - mqtt.publish:
              topic: !lambda |-
                return topic;
              payload: !lambda |-
                return payload;

web_server:
  port: 80
  version: 3

marstack:
  id: marstack_http
  # Since Venus control firmware v150 the battery uploads its telemetry over
  # TLS and resets its own network chip when those uploads go unanswered — every
  # 900 s on WiFi, which is how a battery reaches Marsrelay. Answering them here
  # keeps its upload buffer empty, so the reset never fires.
  https:
    port: 443
  on_request:
    - logger.log:
        format: "HTTP %s %s body=%s"
        args: [method.c_str(), url.c_str(), body.c_str()]
    - mqtt.publish:
        topic: ${mqtt_topic_prefix}/request
        payload: !lambda |-
          return json::build_json([&](JsonObject root) {
            root["source_ip"] = source_ip;
            root["url"] = url;
            root["method"] = method;
            root["body"] = body;
          });
  # Venus telemetry, decoded: about seventy fields per upload, published under
  # marsrelay/venus/<deviceId>/telemetry. This is data the battery sends on its
  # own — it does not replace hm2mqtt, which reads the MQTT side.
  on_venus_upload:
    - mqtt.publish:
        topic: !lambda |-
          return "${mqtt_topic_prefix}/venus/" + device_id + "/telemetry";
        payload: !lambda |-
          return telemetry;

# Diagnostics. Everything below is entity_category diagnostic, so Home Assistant
# files it under the device's diagnostics rather than on a dashboard. Every
# entity is optional; see the README for the full list.
binary_sensor:
  # Device availability as the home broker sees it (via MQTT last will).
  - platform: status
    name: "Marsrelay online"

  - platform: mosquitto_broker
    mosquitto_broker_id: local_broker
    running:
      name: "Local broker running"
    device_active:
      name: "Battery MQTT data"
      # Batteries publish in bursts minutes apart, so keep this well above that.
      timeout: 15min

  - platform: udp_proxy
    udp_proxy_id: meter_proxy
    active:
      name: "UDP proxy active"
    meter_responding:
      name: "Power meter responding"
      timeout: 5min

  - platform: marstack
    marstack_id: marstack_http
    # The battery calls these endpoints on its own schedule, separate from MQTT.
    device_active:
      name: "Battery HTTP requests"
      timeout: 30min

sensor:
  - platform: mosquitto_broker
    mosquitto_broker_id: local_broker
    device_messages:
      name: "Battery messages"
    app_messages:
      name: "Commands relayed"
    publish_errors:
      name: "Broker publish errors"
    broker_restarts:
      name: "Broker restarts"
    device_message_age:
      name: "Last battery message"

  - platform: udp_proxy
    udp_proxy_id: meter_proxy
    packets_to_sta:
      name: "Meter requests forwarded"
    packets_to_ap:
      name: "Meter answers forwarded"
